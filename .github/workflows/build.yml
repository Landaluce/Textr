# Copy this file to .github/workflows/build.yml in the Textr repo.
#
# What it does: on every version tag (v*), builds a standalone Textr binary
# for Linux, Windows, and macOS, then attaches all three to the GitHub release.
# Free for public repos. No Mac or Windows machine needed on your end.
#
# Prerequisites in the repo:
#   - requirements.txt installs cleanly on all three OSes
#     (evdev is already correctly marked sys_platform == "linux")
#   - entry point is main.py  (project.scripts: textr = "main:main")
#
# Usage:
#   git tag v0.2.0 && git push origin v0.2.0
#   -> binaries appear on the GitHub release page a few minutes later.

name: build

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      # Keep building the other OSes even if one fails: maximum signal per run.
      fail-fast: false
      matrix:
        include:
          # NOTE: Linux builds on ubuntu-22.04 (glibc 2.35), NOT ubuntu-latest.
          # Binaries built against older glibc run on newer distros, but not
          # the reverse: a 24.04 build fails on 22.04 with
          # "libm.so.6: version ... not found" from the bundled libpython.
          - os: ubuntu-22.04
            artifact_name: textr-linux
            binary_path: dist/textr
            # --hidden-import: pynput picks its backend via dynamic imports,
            # which PyInstaller's static analysis misses. (Do NOT use
            # --collect-submodules pynput instead: it imports pynput at build
            # time, which needs an X server / display and fails on headless
            # CI runners.)
            pyinstaller_args: --onefile --name textr --paths . --hidden-import=pynput.keyboard._xorg --hidden-import=pynput.mouse._xorg
          - os: windows-latest
            artifact_name: textr-windows
            binary_path: dist/Textr.exe
            # --windowed: no console window for a tray app.
            pyinstaller_args: --onefile --windowed --name Textr --paths . --icon=assets/textr.ico --hidden-import=pynput.keyboard._win32 --hidden-import=pynput.mouse._win32
          - os: macos-latest
            artifact_name: textr-macos
            binary_path: dist/Textr.app
            pyinstaller_args: --onefile --windowed --name Textr --paths . --icon=assets/textr.icns --hidden-import=pynput.keyboard._darwin --hidden-import=pynput.mouse._darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      # PySide6 needs system GL/EGL/xkb libraries that the runner image lacks.
      - name: Install Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxcb-cursor0 libfontconfig1 libdbus-1-3

      # pynput needs an X connection at import time on Linux; xvfb-run
      # (preinstalled on ubuntu-latest) provides one.
      - name: Smoke-test imports (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -c "import daemon, ui, main; print('imports ok')"
      - name: Smoke-test imports (Windows/macOS)
        if: runner.os != 'Linux'
        run: python -c "import daemon, ui, main; print('imports ok')"

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm ${{ matrix.pyinstaller_args }} main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.binary_path }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: binaries

      - name: Zip the macOS .app (directories can't be release attachments)
        run: |
          # upload-artifact stores the bundle *contents* without the Textr.app
          # wrapper, so re-wrap it: macOS only recognizes the bundle with it.
          mv binaries/textr-macos binaries/Textr.app
          cd binaries
          zip -qr Textr-macos.zip Textr.app

      - name: Attach to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          # The tag (v0.2.0) becomes the release; files attached below it.
          files: |
            binaries/textr-linux/textr
            binaries/textr-windows/Textr.exe
            binaries/Textr-macos.zip
